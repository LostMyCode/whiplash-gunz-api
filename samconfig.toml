version = 0.1

[default.global.parameters]
stack_name = "ogz-api"
region     = "ap-northeast-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
# Change the values below to match your actual environment.
# Do not write secrets directly here — use environment variables or AWS Secrets Manager.

# MatchServerHost and MatchServerSecret can be passed via --parameter-overrides
# during sam deploy, or written directly in [default.deploy.parameters] of this file.
# Example:
# parameter_overrides = [
#   "MatchServerHost=your-server-ip",
#   "MatchServerPort=6034",
#   "MatchServerSecret=your-secret-token",
#   "DiscordPublicKey=your-discord-public-key-hex",
#   "StageName=prod"
# ]

[default.sync.parameters]
watch = true
