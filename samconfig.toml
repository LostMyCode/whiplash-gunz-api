version = 0.1

[default.global.parameters]
stack_name    = "whiplash-gunz-api"
region        = "ap-northeast-1"
capabilities  = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3    = true

[default.build.parameters]
cached   = true
parallel = true

# Pass secrets via --parameter-overrides at deploy time.
# Do not commit actual secret values here.
# Example:
#   sam deploy --parameter-overrides \
#     MatchServerHost=<IP> \
#     AdminServerSecret=<SECRET> \
#     DiscordPublicKey=<HEX> \
#     RegistrationSecret=<REG_SECRET> \
#     GoogleClientId=<CLIENT_ID>
